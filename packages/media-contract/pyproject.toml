[project]
name = "visual-memory-media-contract"
version = "0.1.0"
description = "Shared media relay wire contract and client for the Visual Memory Assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.10,<3",
    # numpy 2.5+ requires Python >=3.12; the repository standard mandates 3.11.
    "numpy>=2.4.6,<2.5",
    "websockets>=17,<18",
]

[project.optional-dependencies]
# Decoding jpeg payloads needs Pillow. Kept optional so the Speech Service,
# which consumes the same relay, does not inherit an image library.
images = ["pillow>=12.3,<13"]

[dependency-groups]
dev = [
    "pillow>=12.3,<13",
    "pytest>=8,<9",
    "pyright>=1.1,<2",
    "ruff>=0.9,<1",
    "anyio>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_memory_media_contract"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["visual_memory_media_contract"]
