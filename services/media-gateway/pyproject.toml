[project]
name = "visual-memory-media-gateway"
version = "0.1.0"
description = "Visual Memory Assistant media-gateway service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
    "visual-memory-media-contract",
    # Spike-proven versions (docs/spikes/livekit-media-gateway), still latest.
    "livekit>=1.1.13,<1.2",
    "livekit-api>=1.2,<1.3",
    # numpy 2.5+ requires Python >=3.12; the repository standard mandates 3.11.
    "numpy>=2.4.6,<2.5",
    "pillow>=12.3,<13",
    "python-ulid>=4,<5",
    "websockets>=17,<18",
]

[project.scripts]
virtual-glasses = "media_gateway.publisher.cli:main"

[dependency-groups]
dev = [
    # Also a core runtime dependency now (memory_sink.py's HTTP client to
    # application-memory) -- listed here too because the repo standards
    # validator requires httpx/pytest/pyright/ruff in every service's dev
    # group regardless, and this is what tests import directly.
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pyright>=1.1,<2",
    "ruff>=0.9,<1",
    "pyjwt>=2.13,<3",
    "psutil>=7.2,<8",
    "anyio>=4,<5",
]
# Kept out of the default groups so `uv sync --no-dev` in the Dockerfile never
# installs PyAV. CI's `--all-groups` still type-checks and tests the publisher.
publisher = ["av>=18,<19"]

[tool.uv.sources]
# Editable so edits to the shared package are picked up without a reinstall.
# A non-editable path dependency is copied into the environment, and
# `uv sync --frozen` then audits it as satisfied, so consumers silently keep
# stale contract code. The Dockerfile copies packages/media-contract to the
# same relative offset, so the editable path resolves inside the image too.
visual-memory-media-contract = { path = "../../packages/media-contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_gateway"]

[tool.pytest.ini_options]
# The integration suite needs a real LiveKit server, so it is opt-in: the
# standards CI loop runs `pytest` with no server and must stay green. Run it
# with `-m livekit` once VMA_TEST_LIVEKIT_URL points at one.
addopts = "-q -m 'not livekit'"
testpaths = ["tests"]
markers = ["livekit: requires a running LiveKit server (see tests/integration)"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["media_gateway"]
