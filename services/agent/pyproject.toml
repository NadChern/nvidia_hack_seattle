[project]
name = "visual-memory-agent"
version = "0.1.0"
description = "Visual Memory Assistant agent service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "google-adk>=2.6,<3",
    "httpx>=0.28,<1",
    "litellm>=1.96.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
    "visual-memory-memory-contract[client]",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pyright>=1.1,<2",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

[tool.uv.sources]
visual-memory-memory-contract = { path = "../../packages/memory-contract", editable = true }
