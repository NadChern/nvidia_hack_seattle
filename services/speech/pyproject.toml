[project]
name = "visual-memory-speech"
version = "0.1.0"
description = "Visual Memory Assistant speech service"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Imported directly by api/stt.py to race the transcript-producing loop
    # against watching for a client disconnect -- not just a transitive
    # dependency of fastapi/starlette here, so it earns its own entry.
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    # numpy 2.5+ requires Python >=3.12; the repository standard mandates 3.11.
    # Mirrors services/media-gateway's cap for the same reason.
    "numpy>=2.4.6,<2.5",
    "pydantic>=2.10,<3",
    # Voice activity detection, to split contiguous audio into utterances --
    # see `utterance.py`. A base dependency rather than a per-platform one:
    # it is plain PCM processing needed identically everywhere, and this
    # package vendors the ONNX model with *no* runtime dependencies, unlike
    # `silero-vad` (torch + torchaudio) or `livekit-plugins-silero` (the whole
    # livekit-agents framework).
    "pysilero-vad>=3.4,<4",
    "pydantic-settings>=2.7,<3",
    "soxr>=1.1.0,<2",
    "uvicorn>=0.34,<1",
    "visual-memory-media-contract",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pyright>=1.1,<2",
    "ruff>=0.9,<1",
]
# Apple Silicon only -- `mlx` (parakeet-mlx's and mlx-audio's own dependency)
# has no Linux wheels. Never installed as a base dependency (would break the
# Linux ARM64 Dockerfile, the GN100 deploy, and CI); install explicitly with
# `uv sync --group mlx` for Mac dev. Every entry carries its own
# `sys_platform` marker (not just one marker on the group as a whole -- uv
# has no such thing) so that the repo-standard `uv sync --frozen
# --all-groups` -- which *does* request every group, including this one --
# resolves to "nothing to install here" on Linux instead of failing, rather
# than relying on nobody ever running that command on the wrong platform.
#
# `parakeet-mlx` is pinned tighter than usual (`<0.6`, not just a floor):
# `parakeet_backend.py` calls `parakeet_mlx.utils.from_config` directly
# rather than the package's public `from_pretrained`, because
# `from_pretrained` has no way to pin a revision. That is reaching past the
# package's declared public API (`parakeet_mlx.__init__`'s `__all__`), so a
# wider range risks a silent break on an unannounced internal change.
#
# `mlx-audio`, `misaki[en]`, and `en-core-web-sm` are Kokoro's real
# dependency chain (`kokoro_backend.py`), not optional extras of it: Kokoro's
# English G2P (grapheme-to-phoneme) step hard-requires `misaki`, and
# `misaki[en]` in turn requires a spaCy English model, `en_core_web_sm`,
# which is not on PyPI at all -- spaCy publishes it as a direct wheel URL
# (`[tool.uv.sources]`, below). All three must be declared up front rather
# than left to download at first use, same as the two model checkpoints
# themselves.
mlx = [
    "en-core-web-sm; sys_platform == 'darwin'",
    "misaki[en]>=0.9.4,<0.10; sys_platform == 'darwin'",
    "mlx-audio>=0.4.7,<0.5; sys_platform == 'darwin'",
    "parakeet-mlx>=0.5.2,<0.6; sys_platform == 'darwin'",
    # Nothing here wants torch on a Mac, and yet a Mac needs it: `misaki[en]`
    # pulls spaCy, which pulls `spacy-curated-transformers`, which pulls
    # `curated-transformers`, which requires torch with no platform marker.
    #
    # Declared rather than left transitive, which is the whole point.
    # `[tool.uv.sources]` only redirects dependencies this project *declares*,
    # so while torch arrived four levels down it stayed on the `cuda` group's
    # cu126 pin -- and the resolver, which unifies to one version unless a
    # marker forces a fork, gave darwin `2.6.0+cu126` too. That has Linux and
    # Windows wheels only, so `uv sync --group mlx` failed outright on a Mac
    # and took Parakeet and Kokoro with it. Measured on macOS 26.6.
    "torch==2.6.0; sys_platform == 'darwin'",
]

# Linux + NVIDIA. Never installed as a base dependency: torch alone is
# gigabytes, and a Mac or a CI runner has no use for any of it. Install with
# `uv sync --group cuda`. Every entry carries its own `sys_platform` marker
# for the same reason the `mlx` group's entries do -- the repo-standard
# `uv sync --frozen --all-groups` requests every group, and must resolve to
# "nothing to install here" on a Mac rather than failing.
#
# `transformers`, not NeMo. NVIDIA publishes parakeet-tdt-0.6b-v3 with
# `library_name: transformers` and `ParakeetForTDT` landed in 5.6, so the
# standard loader handles it -- NeMo would drag in hydra, lightning and their
# transitive closure for one model. Verified against the model card's own
# metadata, not assumed.
#
# `misaki[en]` and `en-core-web-sm` are Kokoro's real G2P chain, not optional
# extras -- exactly as the `mlx` group documents for the same model.
cuda = [
    "en-core-web-sm; sys_platform == 'linux'",
    "kokoro>=0.9.4,<0.10; sys_platform == 'linux'",
    # transformers' `ParakeetFeatureExtractor` imports librosa at construction
    # and does not declare it -- `AutoProcessor.from_pretrained` fails with
    # "requires the librosa library" without it. Found by running the model,
    # not by reading the dependency list.
    "librosa>=0.10,<1; sys_platform == 'linux'",
    "misaki[en]>=0.9.4,<0.10; sys_platform == 'linux'",
    # Pinned, and from the cu126 index below -- not a floor. PyPI's default
    # torch build targets a newer CUDA than the dev driver (12.6) supports,
    # and it does not fail loudly: `torch.cuda.is_available()` simply returns
    # False with "the NVIDIA driver on your system is too old" as a warning,
    # so the service silently runs a 0.6B model on CPU. Measured exactly that
    # way before this pin existed. Same reasoning, and same index, as
    # services/vision-worker.
    #
    # The GB10 reports compute capability 12.1. The repository's cu126
    # torch 2.6 wheel imports and reports CUDA available there, but contains
    # kernels only through sm_90 and fails on its first real operation. The
    # exact cu130 nightly below was physically proven on the GN100 with a
    # BF16 CUDA matmul. Keep the older stable pin everywhere else: it remains
    # the measured WSL CUDA profile and avoids moving another platform for a
    # hardware-specific constraint. See standards-exception.toml.
    "torch==2.15.0.dev20260813+cu130; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torch==2.6.0; sys_platform == 'linux' and platform_machine != 'aarch64'",
    # torch's own METADATA declares these exact pinned versions as its CUDA
    # runtime (`pip show torch` lists them under Requires). uv's resolver
    # flattens torch's dependency set from the *aarch64* wheel's metadata
    # (used for GN100/Jetson-style builds, which expect a system-provided
    # CUDA/cuDNN rather than pip packages) rather than the x86_64 wheel's,
    # so on this dev-wsl-cuda profile they're silently absent from uv.lock
    # and torch fails at import with "libcudnn.so.9: cannot open shared
    # object file". Declaring them here, matching torch's own platform
    # marker, keeps them in the lock for x86_64 Linux without affecting the
    # ARM64 GN100 profile, which doesn't need them.
    "nvidia-cublas-cu12==12.6.4.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-cupti-cu12==12.6.80; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-nvrtc-cu12==12.6.77; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12==12.6.77; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.5.1.17; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cufft-cu12==11.3.0.4; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-curand-cu12==10.3.7.77; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cusolver-cu12==11.7.1.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cusparse-cu12==12.5.4.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cusparselt-cu12==0.6.3; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu12==2.21.5; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-nvjitlink-cu12==12.6.85; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-nvtx-cu12==12.6.77; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "triton==3.2.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    # Exact dependency of the GN100 nightly Torch wheel. Declared directly so
    # uv routes it to the explicit cu130 nightly index rather than stopping at
    # PyPI, where this git-suffixed build does not exist.
    "triton==3.8.0+git675c5987; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "transformers>=5.6,<6; sys_platform == 'linux'",
]

[tool.uv.sources]
# The cu126 wheels, not PyPI's default build -- see the `cuda` group above --
# but only where CUDA exists. That index publishes Linux and Windows wheels
# only, so a Mac routed through it does not degrade: `uv sync --group mlx`
# fails outright with "no wheels for the current platform", taking Parakeet
# and Kokoro down with it.
#
# It is not obvious that a Mac needs torch at all, and I wrongly concluded it
# did not: nothing in the `mlx` group names it. The chain is four deep and
# entirely upstream -- `misaki[en]`, Kokoro's G2P, pulls spaCy, which pulls
# `spacy-curated-transformers`, which pulls `curated-transformers`, which
# requires torch with no platform marker. So the darwin arm takes it from
# PyPI, which has an arm64 wheel and no CUDA in it.
torch = [
    { index = "pytorch-cu130-nightly", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" },
]
# The GN100 Torch wheel pins a nightly Triton build unavailable on PyPI.
triton = [
    { index = "pytorch-cu130-nightly", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
# Editable so edits to the shared package are picked up without a reinstall.
# A non-editable path dependency is copied into the environment, and
# `uv sync --frozen` then audits it as satisfied, so this service would
# silently keep stale contract code. Mirrors services/media-gateway.
visual-memory-media-contract = { path = "../../packages/media-contract", editable = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu130-nightly"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# The default index, named only so the darwin arm of `torch` above can refer
# to it -- uv rejects `{ index = "pypi" }` against an index it was never told
# about. Not `explicit`, because this is where everything else already comes
# from; naming it changes nothing about resolution.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speech"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["speech"]
