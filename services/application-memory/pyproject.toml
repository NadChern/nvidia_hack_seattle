[project]
name = "visual-memory-application-memory"
version = "0.1.0"
description = "Visual Memory Assistant application-memory service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
    "visual-memory-memory-contract",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "python-ulid>=4,<5",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pyright>=1.1,<2",
    "ruff>=0.9,<1",
]

[tool.uv.sources]
# Editable so edits to the shared contract are picked up without a
# reinstall. A non-editable path dependency is copied into the environment
# and `uv sync --frozen` then audits it as satisfied, so the service
# silently keeps stale contract code.
visual-memory-memory-contract = { path = "../../packages/memory-contract", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/application_memory"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["application_memory"]
