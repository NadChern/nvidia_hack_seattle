<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0f16; }
  .stage {
    width: 1200px; height: 630px; padding: 76px 82px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e9eef5; position: relative; overflow: hidden;
    background:
      radial-gradient(900px 500px at 82% -10%, rgba(118, 185, 0, 0.16), transparent 60%),
      radial-gradient(700px 420px at 6% 30%, rgba(57, 92, 150, 0.12), transparent 55%),
      #0a0f16;
  }
  .badge {
    display: inline-block; padding: 9px 16px; border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px; font-size: 20px; font-weight: 600; letter-spacing: 0.04em;
    color: #cdd6e2; text-transform: uppercase;
  }
  .badge b { color: #9ae600; font-weight: 700; }
  .title { font-size: 150px; line-height: 1; font-weight: 700; letter-spacing: -0.035em; margin-top: 44px; }
  .title .dot { color: #9ae600; }
  .tagline { font-size: 34px; line-height: 1.3; font-weight: 500; margin-top: 26px; max-width: 980px; color: #e9eef5; }
  .foot {
    position: absolute; left: 82px; right: 82px; bottom: 56px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
  }
  .foot-left { display: flex; align-items: center; gap: 12px; }
  .plabel { font-size: 16px; color: #8b98a8; text-transform: uppercase; letter-spacing: 0.06em; }
  .plogo { display: flex; align-items: center; }
  .plogo img { height: 28px; width: auto; display: block; }
  .pdash { color: #8b98a8; font-size: 16px; }
  .foot-right { font-size: 22px; color: #8b98a8; text-align: right; }
  .foot-right .accent { color: #9ae600; font-weight: 600; }
</style>
</head>
<body>
  <div class="stage">
    <div class="badge"><b>NVIDIA Spark</b> · Hackathon Seattle 2026 · Winner</div>
    <div class="title">MEMO<span class="dot">.</span></div>
    <div class="tagline">A visual memory assistant that remembers where things are, answers everyday questions, and brings a trusted person to help when it matters.</div>
    <div class="foot">
      <div class="foot-left">
        <span class="plabel">Built with</span>
        <span class="plogo"><img src="public/nvidia.svg" alt="NVIDIA"></span>
        <span class="pdash">·</span>
        <span class="plabel">Runs on</span>
        <span class="plogo"><img src="public/acer.svg" alt="Acer"></span>
      </div>
      <div class="foot-right">Local-first and private by default.</div>
    </div>
  </div>
</body>
</html>
